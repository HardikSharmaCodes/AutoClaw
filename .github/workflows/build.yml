name: Build
on:
  push:
    branches: [main]
    paths-ignore: ['**.md', 'docs/**']
  pull_request:
    paths-ignore: ['**.md', 'docs/**']
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: .build
          key: spm-${{ runner.os }}-${{ hashFiles('Package.swift', 'Sources/**') }}
          restore-keys: spm-${{ runner.os }}-
      - name: Build app bundle
        run: ./scripts/build_app.sh
      - name: Zip
        run: cd build && ditto -c -k --keepParent "Claude Servant.app" ClaudeServant.zip
      - uses: actions/upload-artifact@v4
        with:
          name: ClaudeServant
          path: build/ClaudeServant.zip
          compression-level: 0

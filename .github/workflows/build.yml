name: Build
on:
  push:
  pull_request:
jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Build app bundle
        run: ./scripts/build_app.sh
      - name: Zip
        run: cd build && ditto -c -k --keepParent "Claude Servant.app" ClaudeServant.zip
      - uses: actions/upload-artifact@v4
        with:
          name: ClaudeServant
          path: build/ClaudeServant.zip
